[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200

lib_ignore =
    WiFiS3
    Ethernet

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git

build_flags =
    -L .pio/libdeps/uno_r4_minima/micro_ros_arduino/src/renesas_ra/
    -l microros